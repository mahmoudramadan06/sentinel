[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-triage"
version = "0.2.0"
description = "Authorized-scope security workbench: codebase triage agent plus scope-gated engagement planning, safe recon orchestration, and passive OSINT. Deterministic offline core; optional LLM layer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahmoud Ramadan" }]
keywords = ["security", "triage", "sast", "llm", "defensive-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sentinel-triage = "sentinel_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_triage = ["rules/*.json", "data/*.json"]
